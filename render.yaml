# VIA EVENTS — Render Blueprint (tek tık dağıtım)
#
# Bu dosya Render'a şunları kurmasını söyler:
#   - via-events       : Docker ile çalışan web servisi (frontend + backend tek serviste)
#   - via-events-db    : ücretsiz PostgreSQL veritabanı
#
# DATABASE_URL otomatik bağlanır. SECRET_KEY otomatik üretilir.
# ADMIN_EMAIL ve ADMIN_PASSWORD'u Render panelinden kendin gireceksin (sync: false).

services:
  - type: web
    name: via-events
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: via-events-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: VIA Admin

databases:
  - name: via-events-db
    plan: free
    databaseName: via_events
    user: via_events
