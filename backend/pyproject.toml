[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Makul, gürültüsüz bir set. Zamanla sıkılaştırılabilir.
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # satır uzunluğu (formatlayıcıya bırakıldı)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Kademeli tip: şimdilik hoşgörülü; ileride sıkılaştırılır.
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = false
exclude = ["alembic/", "tests/", "smoke_"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/reset_db.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Eşik yok; kapsam raporlanır ama CI'ı düşürmez (ileride yükseltilebilir).
